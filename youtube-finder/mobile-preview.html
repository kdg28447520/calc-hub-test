<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>모바일 화면 확인용</title>
<style>
  body{margin:0;background:#E5E8EB;font:13px/1.4 -apple-system,"Malgun Gothic",sans-serif}
  .row{display:flex;gap:24px;padding:20px;flex-wrap:wrap;align-items:flex-start}
  .dev{background:#fff;border-radius:28px;padding:10px;box-shadow:0 10px 30px rgba(0,0,0,.12)}
  .dev p{margin:0 0 6px;font-weight:700;color:#4E5968;text-align:center}
  iframe{border:0;display:block;border-radius:20px;background:#fff}
</style>
</head>
<body>
<div class="row">
  <div class="dev">
    <p>iPhone 390 × 844</p>
    <iframe src="./index.html?mobilecheck=1" width="390" height="844"></iframe>
  </div>
  <div class="dev">
    <p>갤럭시 360 × 780</p>
    <iframe src="./index.html?mobilecheck=2" width="360" height="780"></iframe>
  </div>
</div>
</body>
</html>
