<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>grid</title>
<style>
  html,body{margin:0;padding:0;background:#fff;overflow-x:hidden}
  .row{display:flex;gap:0}
  .col{position:relative;overflow:hidden;flex:0 0 auto;background:#fff}
  .col iframe{position:absolute;left:0;top:0;border:0;display:block}
</style>
</head>
<body>
<div id="g"></div>
<script>
  var p = new URLSearchParams(location.search);
  var w = +(p.get('w') || 390), h = +(p.get('h') || 14000);
  var vh = +(p.get('vh') || 993), cols = +(p.get('cols') || 4), rows = +(p.get('rows') || 5);
  var g = document.getElementById('g');
  for (var r = 0; r < rows; r++) {
    var row = document.createElement('div');
    row.className = 'row';
    for (var c = 0; c < cols; c++) {
      var off = (r * cols + c) * vh;
      var col = document.createElement('div');
      col.className = 'col';
      col.style.width = w + 'px';
      col.style.height = vh + 'px';
      var f = document.createElement('iframe');
      f.src = './index.html';
      f.style.width = w + 'px';
      f.style.height = h + 'px';
      f.style.transform = 'translateY(' + (-off) + 'px)';
      col.appendChild(f);
      row.appendChild(col);
    }
    g.appendChild(row);
  }
  document.title = 'GRID ' + w + ' rows=' + rows + ' cols=' + cols;
</script>
</body>
</html>
