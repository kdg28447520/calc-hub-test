<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>grid</title>
<style>
  html,body{margin:0;padding:0;background:#fff;overflow:hidden}
  .grid{display:flex;gap:0}
  .col{position:relative;overflow:hidden;flex:0 0 auto;background:#fff}
  .col iframe{position:absolute;left:0;top:0;border:0;display:block}
</style>
</head>
<body>
<div class="grid" id="g"></div>
<script>
  var p = new URLSearchParams(location.search);
  var w = +(p.get('w') || 1280), h = +(p.get('h') || 8000), vh = +(p.get('vh') || 993);
  var offs = (p.get('off') || '0').split(',').map(Number);
  var g = document.getElementById('g');
  offs.forEach(function (o) {
    var col = document.createElement('div');
    col.className = 'col';
    col.style.width = w + 'px';
    col.style.height = vh + 'px';
    var f = document.createElement('iframe');
    f.setAttribute('sandbox', 'allow-scripts');
    f.src = './index.html';
    f.style.width = w + 'px';
    f.style.height = h + 'px';
    f.style.transform = 'translateY(' + (-o) + 'px)';
    col.appendChild(f);
    g.appendChild(col);
  });
  document.title = 'GRID ' + w + ' n=' + offs.length;
</script>
</body>
</html>
