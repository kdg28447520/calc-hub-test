<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>measure</title>
<style>html,body{margin:0;background:#fff}iframe{border:0;display:block}</style>
</head>
<body>
<iframe id="d" src="./index.html" style="width:1280px;height:600px"></iframe>
<iframe id="m" src="./index.html" style="width:390px;height:600px"></iframe>
<script>
function fit(){
  var d=document.getElementById('d'), m=document.getElementById('m');
  try{
    var dh=d.contentDocument.documentElement.scrollHeight;
    var mh=m.contentDocument.documentElement.scrollHeight;
    d.style.height=dh+'px'; m.style.height=mh+'px';
    document.title='D='+dh+' M='+mh;
  }catch(e){document.title='ERR '+e.message;}
}
window.addEventListener('load',function(){fit();setTimeout(fit,800);setTimeout(fit,2000);});
</script>
</body>
</html>
