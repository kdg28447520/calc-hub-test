    { name: '수원역 1호선·수인분당선', address: '경기 수원시 팔달구 덕영대로 924', lat: 37.2657, lng: 127.0000, tag: '역' }
  ];

  const state = {
    origin: { lat: 37.39267, lng: 126.95633, name: '평촌 아크로타워' },
    dest:   { lat: 37.4981, lng: 127.0280, name: '서울 강남역 (2호선·신분당선)' },

  /* ---------- map ---------- */
  const mapLayers = {
    street: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', { maxZoom: 17, attribution: '' }),
    topo: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}', { maxZoom: 16, attribution: '' }),
    minimal: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}', { maxZoom: 16, attribution: '' })
  };
  let activeLayer = 'street';

  function setLayer(layerKey) {
    if (activeLayer === layerKey) return;
    map.removeLayer(mapLayers[activeLayer]);
    mapLayers[layerKey].addTo(map);
    activeLayer = layerKey;
    ['street', 'topo', 'minimal'].forEach(k => {
      const btn = document.getElementById('btn-map-' + k);
      if (!btn) return;
      btn.className = (k === layerKey)
        ? 'px-2 py-0.5 text-[10px] font-bold rounded bg-[#131416] text-white shadow-sm transition-all'
        : 'px-2 py-0.5 text-[10px] font-medium rounded text-[#5D5F60] hover:text-[#131416] transition-all';
    });
  }

  let polylineCasing = null;
  let polylineLayers = [];
  let pinStart = null, pinEnd = null;

  function clearMapLines() {
    if (polylineCasing) { map.removeLayer(polylineCasing); polylineCasing = null; }
    polylineLayers.forEach(l => map.removeLayer(l));
    polylineLayers = [];
    if (pinStart) { map.removeLayer(pinStart); pinStart = null; }
    if (pinEnd) { map.removeLayer(pinEnd); pinEnd = null; }
  }

  function renderMap(pts, singleColor, trafficSegs, destLabel) {
    if (!pts || pts.length < 2) return;
    clearMapLines();
    const startPt = pts[0], endPt = pts[pts.length - 1];

    pinStart = L.marker(startPt, { icon: L.divIcon({ html: '<div class="w-3.5 h-3.5 rounded-full bg-[#1E7B4F] border-2 border-white shadow radar-pulse"></div>', iconSize: [14, 14], iconAnchor: [7, 7] }) }).addTo(map);
    const short = ((destLabel || '도착').replace(/[\(\[][^\)\]]*[\)\]]/g, '').trim().split(' ').slice(-1)[0] || '도착').slice(0, 8);
    pinEnd = L.marker(endPt, { icon: L.divIcon({ html: `<div class="px-2 py-0.5 rounded bg-[#131416] text-white text-[10px] font-medium shadow border border-white">${short}</div>`, iconSize: [60, 20], iconAnchor: [30, 20] }) }).addTo(map);

    polylineCasing = L.polyline(pts, { color: '#FFFFFF', weight: 8, opacity: 0.9, lineCap: 'round', lineJoin: 'round' }).addTo(map);

    if (trafficSegs && trafficSegs.length) {
      trafficSegs.forEach(seg => {
        if (!seg.pts || seg.pts.length < 2) return;
        const layer = L.polyline(seg.pts, { color: seg.color || '#10B981', weight: 5, opacity: 0.95, lineCap: 'round', lineJoin: 'round' }).addTo(map);
        if (seg.name || seg.label) layer.bindTooltip(`${seg.name || '구간'} · ${seg.label} (${Math.round(seg.speed || 0)}km/h)`, { sticky: true });
        polylineLayers.push(layer);
      });
    } else {
      polylineLayers.push(L.polyline(pts, { color: singleColor || '#1E7B4F', weight: 5, opacity: 0.95, lineCap: 'round', lineJoin: 'round' }).addTo(map));
    }
    recenterMap();
  }

  function recenterMap() {
    if (!polylineCasing) return;
    map.fitBounds(polylineCasing.getBounds(), { paddingTopLeft: [40, 40], paddingBottomRight: [40, 40], maxZoom: 14 });
  }

  /* ---------- POI search (SK TMAP) ---------- */
  let activeInputTarget = 'dest';
  let searchDebounceTimer = null;

  async function searchTmapPois(keyword) {
    const q = (keyword || '').trim();
    if (!q) return [];
    async function fetchPoi(query) {
      try {
        const url = `https://apis.openapi.sk.com/tmap/pois?version=1&searchKeyword=${encodeURIComponent(query)}&count=8`;
        const res = await fetch(url, { headers: { appKey: CFG.TMAP_KEY } });
        if (!res.ok) return [];
        const data = await res.json();
        const list = (data && data.searchPoiInfo && data.searchPoiInfo.pois && data.searchPoiInfo.pois.poi) || [];
        return list.map(p => {
          const roadAddr = (p.newAddressList && p.newAddressList.newAddress && p.newAddressList.newAddress[0] && p.newAddressList.newAddress[0].fullAddressRoad) || '';
          const jibun = `${p.upperAddrName || ''} ${p.middleAddrName || ''} ${p.lowerAddrName || ''}`.replace(/\s+/g, ' ').trim();
          return {
            name: p.name,
            address: roadAddr || jibun,
            lat: parseFloat(p.frontLat || p.noorLat),
            lng: parseFloat(p.frontLon || p.noorLon),
            biz: p.middleBizName || p.upperBizName || ''
          };
        });
      } catch (e) { return []; }
    }
    let results = await fetchPoi(q);
    if (results.length === 0 && q.length > 2) results = await fetchPoi(q.slice(0, -1));
    return results;
  }

  function handleLivePoiSearch(keyword, target) {
    activeInputTarget = target;
    const q = (keyword || '').trim();
    const el = document.getElementById('poiDropdown');
    const label = document.getElementById('dropdownTargetLabel');
    const listEl = document.getElementById('dropdownList');
    label.innerText = (target === 'origin' ? '📍 출발지 검색 결과' : '🏁 도착지 검색 결과');
    el.classList.remove('hidden');

    if (!q) {
      listEl.innerHTML = '';
      QUICK_POIS.forEach(item => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'w-full text-left p-2 rounded-md hover:bg-[#F4F6F8] border border-transparent hover:border-[#E8EAEC] flex items-center justify-between transition-all';
        btn.innerHTML = `<div class="truncate pr-2"><div class="text-xs font-semibold text-[#131416] truncate">${item.name}</div><div class="text-[10px] text-[#8A8C8E] truncate">${item.address}</div></div><span class="text-[9px] font-bold px-1.5 py-0.5 rounded bg-[#F4F6F8] text-[#5D5F60] shrink-0">${item.tag || ''}</span>`;
        btn.onclick = () => selectPoi(item);
        listEl.appendChild(btn);
      });
      return;
    }

    if (searchDebounceTimer) clearTimeout(searchDebounceTimer);
    listEl.innerHTML = `<div class="p-3 text-center text-xs text-[#5D5F60]">'${q}' 실시간 장소 검색 중…</div>`;

    searchDebounceTimer = setTimeout(async () => {
      const results = await searchTmapPois(q);
      listEl.innerHTML = '';
      if (!results.length) {
        listEl.innerHTML = `<div class="p-4 text-center"><div class="text-xs font-medium text-[#131416]">'${q}' 검색 결과가 없습니다</div><div class="text-[10px] text-[#8A8C8E] mt-1">지번, 도로명 또는 건물명으로 다시 시도해 주세요</div></div>`;
        return;
      }
      results.forEach(item => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'w-full text-left p-2 rounded-md hover:bg-[#F4F6F8] border border-transparent hover:border-[#E8EAEC] flex items-center justify-between transition-all cursor-pointer';
        btn.innerHTML = `<div class="truncate pr-2"><div class="text-xs font-semibold text-[#131416] truncate">${item.name}</div><div class="text-[10px] text-[#8A8C8E] truncate">${item.address}</div></div>${item.biz ? `<span class="text-[9px] text-[#5D5F60] bg-[#F0F1F2] px-1.5 py-0.5 rounded shrink-0">${item.biz}</span>` : ''}`;
        btn.onclick = () => selectPoi(item);
        listEl.appendChild(btn);
      });
    }, 200);
  }

  function hidePoiDropdown() { document.getElementById('poiDropdown').classList.add('hidden'); }

  function selectPoi(item) {
    if (activeInputTarget === 'origin') {
      document.getElementById('inputOrigin').value = item.name;
      state.origin = { lat: item.lat, lng: item.lng, name: item.name };
    } else {
      document.getElementById('inputDest').value = item.name;
      state.dest = { lat: item.lat, lng: item.lng, name: item.name };
    }
    hidePoiDropdown();

  function clearInput(target) {
    if (target === 'origin') {
      const inp = document.getElementById('inputOrigin'); inp.value = ''; inp.focus(); handleLivePoiSearch('', 'origin');
    } else {
      const inp = document.getElementById('inputDest'); inp.value = ''; inp.focus(); handleLivePoiSearch('', 'dest');
    }
  }

  function swapOriginDest() {
    const a = document.getElementById('inputOrigin'), b = document.getElementById('inputDest');
    const tmp = a.value; a.value = b.value; b.value = tmp;
    const t = state.origin; state.origin = state.dest; state.dest = t;
    executeRouteSearch();
  }

  function useCurrentGps() {
    if (!navigator.geolocation) { alert('이 기기는 GPS를 지원하지 않습니다.'); return; }
    navigator.geolocation.getCurrentPosition(
      pos => {
        state.origin = { lat: pos.coords.latitude, lng: pos.coords.longitude, name: '내 현재 위치' };
        document.getElementById('inputOrigin').value = '내 현재 위치';
        executeRouteSearch();
      },
      () => alert('GPS 위치 권한을 확인해 주세요. 출발지는 그대로 둡니다.')
    );
  }

  /* ---------- live route calls ---------- */
  async function fetchTmap(origin, dest) {
    const t0 = performance.now();
    try {
      const res = await fetch('https://apis.openapi.sk.com/tmap/routes?version=1', {
        method: 'POST',
        headers: { appKey: CFG.TMAP_KEY, 'Content-Type': 'application/json' },
        body: JSON.stringify({
          startX: String(origin.lng), startY: String(origin.lat),
          endX: String(dest.lng), endY: String(dest.lat),
          reqCoordType: 'WGS84GEO', resCoordType: 'WGS84GEO',
          searchOption: '0', trafficInfo: 'Y'
        })
      });
      const ms = Math.round(performance.now() - t0);
      if (!res.ok) return { ok: false, ms, reason: `HTTP ${res.status}` };
      const data = await res.json();
      const p = data && data.features && data.features[0] && data.features[0].properties;
      if (!p || !p.totalTime) return { ok: false, ms, reason: '응답 형식 오류' };
      const pts = [];
      (data.features || []).forEach(f => {
        if (f.geometry && f.geometry.type === 'LineString' && f.geometry.coordinates) {
          f.geometry.coordinates.forEach(c => pts.push([c[1], c[0]]));
        }
      });
      return {
        ok: true, ms,
        minutes: Math.round(p.totalTime / 60),
        km: Math.round(p.totalDistance / 100) / 10,
        toll: p.totalFare || 0,
        pts,
        note: 'SK TMAP 실시간 경로'
      };
    } catch (e) {
      return { ok: false, ms: Math.round(performance.now() - t0), reason: '네트워크 오류' };
    }
  }

  async function fetchKakao(origin, dest) {
    const t0 = performance.now();
    try {
      const url = `https://apis-navi.kakaomobility.com/v1/directions?origin=${origin.lng},${origin.lat}&destination=${dest.lng},${dest.lat}&priority=RECOMMEND&car_type=1`;
      const res = await fetch(url, { headers: { Authorization: `KakaoAK ${CFG.KAKAO_KEY}` } });
      const ms = Math.round(performance.now() - t0);
      if (!res.ok) return { ok: false, ms, reason: `HTTP ${res.status}` };
      const data = await res.json();
      const r = data && data.routes && data.routes[0];
      if (!r || !r.summary) {
        const msg = (r && r.result_msg) ? r.result_msg.slice(0, 16) : '응답 형식 오류';
        return { ok: false, ms, reason: msg };
      }
      const s = r.summary;
      const pts = [], segs = [];
      (r.sections || []).forEach(sec => (sec.roads || []).forEach(road => {
        const vx = road.vertexes || [];
        const roadPts = [];
        for (let i = 0; i < vx.length; i += 2) { const pt = [vx[i + 1], vx[i]]; pts.push(pt); roadPts.push(pt); }
        let color = '#10B981', label = '원활';
        const st = road.traffic_state;
        if (st === 3) { color = '#FBBF24'; label = '서행'; }
        else if (st === 2) { color = '#F97316'; label = '지체'; }
        else if (st === 1 || st === 6) { color = '#EF4444'; label = '정체'; }
        if (roadPts.length > 1) segs.push({ name: road.name || '도로', color, label, speed: road.traffic_speed || 0, pts: roadPts });
      }));
      return {
        ok: true, ms,
        minutes: Math.round(s.duration / 60),
        km: Math.round(s.distance / 100) / 10,
        toll: (s.fare && s.fare.toll) || 0,
        pts, segs,
        note: '카카오모빌리티 실시간 경로'
      };
    } catch (e) {
      return { ok: false, ms: Math.round(performance.now() - t0), reason: '네트워크 오류' };
    }
  }

  async function fetchNaver(origin, dest) {
    const t0 = performance.now();
    try {
      const url = `${CFG.NAVER_PROXY}?start=${origin.lng},${origin.lat}&goal=${dest.lng},${dest.lat}&option=trafast`;
      const res = await fetch(url);
      const ms = Math.round(performance.now() - t0);
      if (!res.ok) {
        const why = res.status === 404 ? '프록시 없는 주소(정적 호스팅)' : `HTTP ${res.status}`;
        return { ok: false, ms, reason: why };
      }
      const data = await res.json();
      if (!data || data.code !== 0 || !data.route || !data.route.trafast || !data.route.trafast[0]) {
        return { ok: false, ms, reason: (data && data.message) || '응답 형식 오류' };
      }
      const t = data.route.trafast[0];
      const s = t.summary;
      const pts = (t.path || []).map(p => [p[1], p[0]]);
      return {
        ok: true, ms,
        minutes: Math.round(s.duration / 60000),
        km: Math.round(s.distance / 100) / 10,
        toll: s.tollFare || 0,
        pts,
        note: '네이버 Directions 5 실시간 경로'
      };
    } catch (e) {
      return { ok: false, ms: Math.round(performance.now() - t0), reason: '프록시 연결 실패' };
    }
  }

  /* ---------- render ---------- */
  function arriveTime(min) {
    const now = new Date(); now.setMinutes(now.getMinutes() + min);
    return `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')} 도착`;
  }

  function renderPresetChips(activeKey) {
    const wrap = document.getElementById('presetChips');
    wrap.innerHTML = '';
    PRESETS.forEach(p => {
      const b = document.createElement('button');
      const on = p.key === activeKey;
      b.className = 'dest-chip shrink-0 px-2.5 py-1 rounded-md text-xs transition-all ' +
        (on ? 'font-semibold bg-[#131416] text-white' : 'font-medium bg-white text-[#5D5F60] border border-[#E8EAEC] hover:border-[#CDCED1]');
      b.innerText = p.label;
      b.onclick = () => {
        state.dest = { lat: p.lat, lng: p.lng, name: p.name };
        document.getElementById('inputDest').value = p.name;
        executeRouteSearch(p.key);
      };
      wrap.appendChild(b);
    });
  }

  function renderRows() {
    const box = document.getElementById('rows');
    const res = state.results;
    if (!res) return;
    const order = Object.keys(NAVIS).slice().sort((a, b) => {
      const ta = res[a] && res[a].ok ? res[a].minutes : 9999;
      const tb = res[b] && res[b].ok ? res[b].minutes : 9999;
      return ta - tb;
    });
    const fastest = order.find(k => res[k] && res[k].ok);
    const fastestMin = fastest ? res[fastest].minutes : null;
    box.innerHTML = '';

    order.forEach((k, idx) => {
      const meta = NAVIS[k], r = res[k];
      const ok = r && r.ok;
      const isActive = k === state.activeNavi;
      const el = document.createElement('div');
      el.id = 'item-' + k;
      el.className = 'navi-row-item p-2.5 rounded-lg cursor-pointer mb-2 ' + (isActive ? 'active' : '');
      let badge, badgeCls;
      if (!ok) { badge = '호출 실패'; badgeCls = 'bg-[#FEE4E2] text-[#B42318]'; }
      else if (k === fastest) { badge = '최속 1위'; badgeCls = 'bg-[#DCFAE5] text-[#04250E]'; }
      else { badge = `${idx + 1}위`; badgeCls = 'bg-[#F4F6F8] text-[#5D5F60]'; }

      const diff = ok && fastestMin != null ? (k === fastest ? '기준 (가장 빠름)' : `+${r.minutes - fastestMin}분`) : (r ? r.reason : '대기');
      const diffCls = ok && k === fastest ? 'text-[#1E7B4F] font-bold' : (ok ? 'text-[#5D5F60] font-medium' : 'text-[#B42318] font-medium');
      const subLeft = ok ? `${r.km.toFixed(1)}km · ${r.toll.toLocaleString()}원` : '–';
      const subRight = ok ? `실시간 · ${(r.ms / 1000).toFixed(1)}s` : `${(r ? r.ms / 1000 : 0).toFixed(1)}s`;

      el.innerHTML = `
        <div class="flex items-center justify-between gap-1">
          <div class="flex items-center gap-1.5 min-w-0">
            <span class="w-2 h-2 rounded-full shrink-0" style="background:${meta.dot}"></span>
            <span class="text-xs font-bold text-[#131416] whitespace-nowrap">${meta.name}</span>
            <span class="navi-rank-badge text-[10px] font-bold px-1.5 py-0.5 rounded ${badgeCls} whitespace-nowrap shrink-0">${badge}</span>
          </div>
          <div class="flex items-baseline justify-end shrink-0 whitespace-nowrap">
            <span class="text-base font-semibold text-[#131416] tabular">${ok ? r.minutes : '–'}</span><span class="text-xs text-[#5D5F60] ml-0.5">분</span>
            <span class="navi-diff-text text-[11px] ml-1.5 whitespace-nowrap tabular ${diffCls}">${diff}</span>
          </div>
        </div>
        <div class="flex items-center justify-between text-[11px] text-[#5D5F60] mt-1 pt-1 border-t border-[#F0F1F2]">
          <span class="tabular truncate">${subLeft}</span>
          <span class="text-right truncate pl-2 ${ok ? '' : 'text-[#B42318]'}">${subRight}</span>
        </div>`;
      el.onclick = () => { if (ok) pickNavi(k); };
      box.appendChild(el);
    });

    document.getElementById('sortLabel').innerText = fastest ? `실시간 빠른 순서 · ${NAVIS[fastest].name} 1위` : '실시간 결과 없음';
  }

  function pickNavi(k) {
    const res = state.results;
    if (!res || !res[k] || !res[k].ok) return;
    state.activeNavi = k;
    document.querySelectorAll('.navi-row-item').forEach(c => c.classList.remove('active'));
    const el = document.getElementById('item-' + k);
    if (el) el.classList.add('active');

    const r = res[k];
    const fastest = Object.keys(NAVIS).filter(x => res[x] && res[x].ok).sort((a, b) => res[a].minutes - res[b].minutes)[0];
    const isFastest = k === fastest;

    document.getElementById('activeNaviLabel').innerText = `${NAVIS[k].name} ${isFastest ? '실시간 최속' : '경로'}`;
    document.getElementById('activeArriveTime').innerText = arriveTime(r.minutes);
    document.getElementById('kpiDuration').innerText = r.minutes;
    document.getElementById('kpiDistance').innerText = `${r.km.toFixed(1)} km`;
    document.getElementById('kpiToll').innerText = `통행료 ${r.toll.toLocaleString()}원`;
    document.getElementById('kpiRouteNote').innerText = r.note;

    const badge = document.getElementById('kpiDiffBadge');
    if (isFastest) { badge.innerText = '최속 1위'; badge.className = 'text-[10px] font-bold px-1.5 py-0.5 rounded bg-[#DCFAE5] text-[#04250E] whitespace-nowrap shrink-0'; }
    else {
      const f = res[fastest];
      badge.innerText = `+${r.minutes - f.minutes}분`; badge.className = 'text-[10px] font-medium px-1.5 py-0.5 rounded bg-[#F4F6F8] text-[#5D5F60] whitespace-nowrap shrink-0';
    }

    const d = state.dest;
    const q = encodeURIComponent(d.name);
    const schemes = {
      tmap: `tmap://route?goalname=${q}&goalx=${d.lng}&goaly=${d.lat}`,
      naver: `nmap://route/car?dlat=${d.lat}&dlng=${d.lng}&dname=${q}`,
      kakao: `kakaonavi://navigate?name=${q}&x=${d.lng}&y=${d.lat}`
    };
    document.getElementById('btnPrimary').href = schemes[k];
    document.getElementById('btnPrimaryText').innerText = NAVIS[k].cta;
    document.getElementById('mapRouteName').innerText = `${NAVIS[k].name} 경로 (${r.minutes}분)`;

    renderMap(r.pts && r.pts.length > 1 ? r.pts : null, NAVIS[k].line, k === 'kakao' ? r.segs : null, d.name);
  }

  function setLive(ok, label) {
    const dot = document.getElementById('liveDot');
    dot.className = 'w-1.5 h-1.5 rounded-full ' + (ok ? 'bg-[#1E7B4F]' : 'bg-[#D92D20]');
    document.getElementById('liveLabel').innerText = label;
  }

  /* ---------- main ---------- */
  async function executeRouteSearch(presetKey) {
    if (state.busy) return;
    const originText = document.getElementById('inputOrigin').value.trim();
    const destText = document.getElementById('inputDest').value.trim();
    if (!originText) { alert('출발지를 입력해 주세요.'); document.getElementById('inputOrigin').focus(); return; }
    if (!destText) { alert('도착지를 입력해 주세요.'); document.getElementById('inputDest').focus(); return; }

    hidePoiDropdown();
    state.busy = true;
    const btnText = document.getElementById('btnRouteSearchText');
    btnText.innerText = '⚡ 3사 실시간 동시 호출 중…';
    document.getElementById('statusLine').innerText = '호출 중…';
    setLive(true, '호출 중');

    try {
      if (originText !== state.origin.name) {
        const hits = await searchTmapPois(originText);
        if (!hits.length) { alert(`출발지 '${originText}'의 위치를 찾을 수 없습니다.`); return; }
        state.origin = { lat: hits[0].lat, lng: hits[0].lng, name: hits[0].name };
        document.getElementById('inputOrigin').value = hits[0].name;
      }
      if (destText !== state.dest.name) {
        const hits = await searchTmapPois(destText);
        if (!hits.length) { alert(`도착지 '${destText}'의 위치를 찾을 수 없습니다.`); return; }
        state.dest = { lat: hits[0].lat, lng: hits[0].lng, name: hits[0].name };
        document.getElementById('inputDest').value = hits[0].name;
      }

      const t0 = performance.now();
      const [tmap, kakao, naver] = await Promise.all([
        fetchTmap(state.origin, state.dest),
        fetchKakao(state.origin, state.dest),
        fetchNaver(state.origin, state.dest)
      ]);
      const total = ((performance.now() - t0) / 1000).toFixed(1);

      state.results = { tmap, kakao, naver };
      const okCount = [tmap, kakao, naver].filter(r => r.ok).length;

      renderPresetChips(presetKey || null);
      const fastestKey = ['tmap', 'kakao', 'naver'].filter(k => state.results[k].ok)
        .sort((a, b) => state.results[a].minutes - state.results[b].minutes)[0];
      state.activeNavi = fastestKey || 'tmap';
      renderRows();
      if (fastestKey) pickNavi(fastestKey);

      document.getElementById('statusLine').innerText = `3사 동시 호출 ${total}s`;
      setLive(okCount === 3, okCount === 3 ? '실시간 3/3' : `실시간 ${okCount}/3`);
    } catch (e) {
      console.error(e);
      document.getElementById('statusLine').innerText = '오류';
      setLive(false, '오류');
      alert('실시간 경로를 계산하는 도중 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.');
    } finally {
      state.busy = false;
      btnText.innerText = '실시간 3사 내비 비교 길찾기';
    }
  }

  /* PWA */
  let deferredPrompt = null;
  window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault(); deferredPrompt = e;
    const b = document.getElementById('btnPwaInstall'); if (b) b.classList.remove('hidden');
  });
  function installPwa() {
    if (!deferredPrompt) return;
    deferredPrompt.prompt(); deferredPrompt = null;
    document.getElementById('btnPwaInstall').classList.add('hidden');
  }
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
  }
  window.addEventListener('resize', () => { map.invalidateSize(); recenterMap(); });

  /* initial: run a real search for the default route */
  renderPresetChips('gangnam');
  executeRouteSearch('gangnam');
  </script>
</body>
</html>
