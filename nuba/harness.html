<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>누빠 반응형 검수</title>
  <style>
    body { margin:0; padding:16px; background:#E5E7EB; display:flex; gap:16px; justify-content:center; font-family:-apple-system,sans-serif; }
    .frame { background:#FFF; border-radius:36px; box-shadow:0 25px 50px -12px rgba(0,0,0,.25); border:8px solid #1F2937; overflow:hidden; display:flex; flex-direction:column; }
    .head { background:#1F2937; color:#FFF; padding:6px 14px; font-size:11px; font-weight:bold; text-align:center; }
    iframe { border:none; flex:1; }
  </style>
</head>
<body>
  <div class="frame" style="width:393px;height:820px;"><div class="head">iPhone 15/16 · 393×852</div><iframe src="/"></iframe></div>
  <div class="frame" style="width:360px;height:770px;"><div class="head">Galaxy 커버 · 360×800</div><iframe src="/"></iframe></div>
  <div class="frame" style="width:700px;height:820px;"><div class="head">Z Fold 펼침 · 700×852</div><iframe src="/"></iframe></div>
</body>
</html>
